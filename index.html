<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>五子棋对战 · 免服务器版</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(160deg, #f6f8fc 0%, #e8ecf5 100%);
  color: #333;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

.page {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  max-width: 560px;
  margin: 0 auto;
  padding: 0 14px 20px;
}

.page.active {
  display: flex;
}

.hidden {
  display: none !important;
}

/* 头部 */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
}

.header h1 {
  font-size: 22px;
  color: #2c3e50;
  font-weight: 700;
}

.room-title {
  font-size: 16px;
  color: #2c3e50;
}

.room-title b {
  color: #3498db;
  letter-spacing: 2px;
}

.conn-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #7f8c8d;
}

.status-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.status-indicator.online {
  background: #27ae60;
  box-shadow: 0 0 6px rgba(39, 174, 96, 0.6);
}

.status-indicator.offline {
  background: #e74c3c;
  box-shadow: 0 0 6px rgba(231, 76, 60, 0.6);
}

/* 按钮 */
.btn {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.12s, opacity 0.12s, background 0.2s;
  touch-action: manipulation;
}

.btn:active {
  transform: scale(0.96);
}

.btn-primary {
  background: #3498db;
  color: #fff;
}

.btn-primary:active { background: #2980b9; }

.btn-secondary {
  background: #27ae60;
  color: #fff;
}

.btn-secondary:active { background: #1e8449; }

.btn-ghost {
  background: transparent;
  color: #7f8c8d;
  border: 1px solid #d5dbe5;
}

.btn-ghost:active { background: #eef1f6; }

.btn-control {
  background: #fff;
  color: #34495e;
  border: 1px solid #d8dee9;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}

.btn-control:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-control.danger {
  color: #e74c3c;
}

.btn-sm {
  padding: 7px 12px;
  font-size: 14px;
}

.btn-block {
  width: 100%;
}

/* ============ 大厅 ============ */
.lobby-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 18px;
}

.lobby-card {
  background: #fff;
  border-radius: 16px;
  padding: 22px 20px;
  box-shadow: 0 8px 30px rgba(31, 45, 61, 0.08);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.field label {
  display: block;
  font-size: 13px;
  color: #7f8c8d;
  margin-bottom: 8px;
  font-weight: 600;
}

.field input[type="text"],
.field input[type="number"] {
  width: 100%;
  padding: 12px;
  border: 1px solid #dfe4ec;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
  background: #fafbfd;
}

.field input:focus {
  border-color: #3498db;
  background: #fff;
}

.seg {
  display: flex;
  background: #eef1f6;
  border-radius: 10px;
  padding: 4px;
  gap: 4px;
}

.seg-btn {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #7f8c8d;
  cursor: pointer;
  transition: all 0.2s;
}

.seg-btn.active {
  background: #fff;
  color: #2c3e50;
  box-shadow: 0 2px 8px rgba(31, 45, 61, 0.12);
}

.timer-options {
  margin-top: 8px;
  display: flex;
  gap: 10px;
}

.timer-opt {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 14px;
  color: #555;
  background: #fafbfd;
  border: 1px solid #e3e8f0;
  border-radius: 10px;
  padding: 8px;
}

.timer-opt input {
  width: 60px;
  padding: 6px;
  border: 1px solid #dfe4ec;
  border-radius: 6px;
  font-size: 15px;
  text-align: center;
  outline: none;
}

.divider {
  display: flex;
  align-items: center;
  color: #aab3c2;
  font-size: 13px;
  gap: 10px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #e7ebf2;
}

.join-row {
  display: flex;
  gap: 10px;
}

.join-row input {
  flex: 1;
  padding: 12px;
  border: 1px solid #dfe4ec;
  border-radius: 10px;
  font-size: 18px;
  text-align: center;
  letter-spacing: 4px;
  outline: none;
  background: #fafbfd;
}

.join-row input:focus {
  border-color: #27ae60;
  background: #fff;
}

/* ============ 对局页面 ============ */
.game-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.player-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border-radius: 14px;
  padding: 10px 14px;
  box-shadow: 0 3px 12px rgba(31, 45, 61, 0.06);
  border: 2px solid transparent;
}

.player-bar.turning {
  border-color: #f39c12;
  box-shadow: 0 0 0 2px rgba(243, 156, 18, 0.25), 0 3px 12px rgba(31,45,61,0.08);
}

.piece-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  flex-shrink: 0;
}

.piece-avatar.black {
  background: radial-gradient(circle at 35% 35%, #5a5a5a, #111);
  border: 2px solid #000;
}

.piece-avatar.white {
  background: radial-gradient(circle at 35% 35%, #fff, #cfcfcf);
  border: 2px solid #bbb;
}

.player-meta {
  flex: 1;
  min-width: 0;
}

.player-name {
  font-size: 15px;
  font-weight: 600;
  color: #2c3e50;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-role {
  font-size: 12px;
  color: #95a0b1;
  margin-top: 2px;
}

.player-clock {
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #2c3e50;
  background: #f0f3f8;
  padding: 6px 10px;
  border-radius: 8px;
  min-width: 72px;
  text-align: center;
}

.player-clock.low {
  color: #e74c3c;
  animation: blink 1s infinite;
}

.me .player-clock {
  order: -1;
}

@keyframes blink {
  50% { opacity: 0.4; }
}

.status-line {
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: #34495e;
  background: rgba(52, 152, 219, 0.08);
  border-radius: 10px;
  padding: 8px 12px;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.board-container {
  display: flex;
  justify-content: center;
  align-items: center;
}

#gameBoard {
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(31, 45, 61, 0.18);
  touch-action: manipulation;
}

.controls {
  display: flex;
  gap: 10px;
}

.controls .btn {
  flex: 1;
}

.move-panel {
  background: #fff;
  border-radius: 12px;
  padding: 10px 14px;
  box-shadow: 0 3px 12px rgba(31, 45, 61, 0.06);
}

.move-panel summary {
  font-size: 14px;
  font-weight: 600;
  color: #7f8c8d;
  cursor: pointer;
  user-select: none;
}

.move-list {
  max-height: 130px;
  overflow-y: auto;
  margin-top: 8px;
  font-size: 13px;
  color: #6c757d;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.move-item {
  padding: 4px 6px;
  background: #f5f7fa;
  border-radius: 6px;
  text-align: center;
}

.move-item.last {
  background: #d6ecff;
  color: #1f6fb2;
  font-weight: 700;
}

/* ============ 弹窗 ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 28, 40, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 24px;
}

.modal {
  background: #fff;
  border-radius: 16px;
  padding: 24px 20px 18px;
  width: 100%;
  max-width: 340px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  animation: pop 0.18s ease-out;
}

@keyframes pop {
  from { transform: scale(0.92); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal h3 {
  font-size: 18px;
  color: #2c3e50;
  text-align: center;
  margin-bottom: 10px;
}

.modal p {
  font-size: 15px;
  color: #5d6b7f;
  text-align: center;
  margin-bottom: 20px;
  line-height: 1.5;
  word-break: break-all;
}

.modal-buttons {
  display: flex;
  gap: 10px;
}

.modal-buttons .btn {
  flex: 1;
}

/* ============ Toast ============ */
.toast {
  position: fixed;
  left: 50%;
  bottom: 60px;
  transform: translateX(-50%);
  background: rgba(44, 62, 80, 0.92);
  color: #fff;
  padding: 11px 20px;
  border-radius: 22px;
  font-size: 14px;
  z-index: 1200;
  max-width: 86%;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  animation: toastIn 0.25s ease-out;
  word-break: break-all;
}

@keyframes toastIn {
  from { transform: translate(-50%, 12px); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}

.p2p-tip {
  font-size: 12px;
  color: #95a0b1;
  background: #f4f7ff;
  border-radius: 8px;
  padding: 8px 10px;
  line-height: 1.5;
  margin-top: 8px;
}

  </style>
</head>
<body>

  <!-- ======== 大厅 ======== -->
  <div id="lobby" class="page active">
    <header class="header">
      <h1>⚫ 五子棋对战 ⚪</h1>
    </header>

    <main class="lobby-content">
      <div class="lobby-card">
        <div class="field">
          <label>你的昵称</label>
          <input type="text" id="playerName" maxlength="12" placeholder="请输入昵称">
        </div>

        <div class="field">
          <label>计时规则</label>
          <div class="seg" id="timerSeg">
            <button type="button" class="seg-btn active" data-mode="none">不限时</button>
            <button type="button" class="seg-btn" data-mode="total">每方总时间</button>
            <button type="button" class="seg-btn" data-mode="perMove">每步限时</button>
          </div>
          <div class="timer-options">
            <label id="totalWrap" class="timer-opt hidden">
              每方
              <input type="number" id="totalMinutes" value="10" min="1" max="99">
              分钟
            </label>
            <label id="perMoveWrap" class="timer-opt hidden">
              每步
              <input type="number" id="perMoveSeconds" value="30" min="5" max="300">
              秒
            </label>
          </div>
          <div class="p2p-tip">本版为「手机直连」模式：无需服务器，两台手机打开同一个网页即可对战。</div>
        </div>

        <button id="createRoomBtn" class="btn btn-primary btn-block">创建房间</button>

        <div class="divider"><span>或加入朋友房间</span></div>

        <div class="join-row">
          <input type="text" id="roomId" maxlength="6" placeholder="6位房间码" inputmode="numeric" autocomplete="off">
          <button id="joinRoomBtn" class="btn btn-secondary">加入房间</button>
        </div>
      </div>

      <div class="conn-status">
        <span id="statusIndicator" class="status-indicator offline"></span>
        <span id="statusText">未连接</span>
      </div>
    </main>
  </div>

  <!-- ======== 对局页面 ======== -->
  <div id="gameRoom" class="page">
    <header class="header">
      <button id="backToLobbyBtn" class="btn btn-ghost btn-sm">‹ 退出</button>
      <div class="room-title">房间 <b id="roomIdDisplay">------</b></div>
      <div class="conn-status">
        <span id="gameStatusIndicator" class="status-indicator offline"></span>
        <span id="gameStatusText">离线</span>
      </div>
    </header>

    <main class="game-content">
      <!-- 对方 -->
      <div class="player-bar opp" id="oppBar">
        <div class="piece-avatar black" id="oppAvatar"></div>
        <div class="player-meta">
          <div class="player-name" id="oppName">等待对手…</div>
          <div class="player-role" id="oppRole">黑棋 · 先手</div>
        </div>
        <div class="player-clock" id="oppClock">--:--</div>
      </div>

      <div class="status-line" id="statusTextLine">等待对手加入…</div>

      <div class="board-container" id="boardContainer">
        <canvas id="gameBoard"></canvas>
      </div>

      <!-- 我方 -->
      <div class="player-bar me" id="myBar">
        <div class="player-clock me-clock" id="myClock">--:--</div>
        <div class="player-meta">
          <div class="player-name" id="myName">我</div>
          <div class="player-role" id="myRole">--</div>
        </div>
        <div class="piece-avatar white" id="myAvatar"></div>
      </div>

      <div class="controls">
        <button id="undoBtn" class="btn btn-control" disabled>悔棋</button>
        <button id="resignBtn" class="btn btn-control danger" disabled>认输</button>
        <button id="rematchBtn" class="btn btn-control" disabled>再来一局</button>
      </div>

      <details class="move-panel">
        <summary>走棋记录</summary>
        <div id="moveList" class="move-list"></div>
      </details>
    </main>
  </div>

  <!-- ======== 弹窗 ======== -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div id="modalButtons" class="modal-buttons"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  </script>
  <script>
(function () {
  'use strict';

  var PEER_PREFIX = 'wzq';
  var ICE_SERVERS = {
    config: {
      iceServers: [
        { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
        { urls: ['stun:stun.miwifi.com:3478'] },
        { urls: ['stun:stun.nextcloud.com:3478'] }
      ]
    }
  };

  function generateCode() {
    return String(Math.floor(100000 + Math.random() * 900000));
  }

  function PeerUnavailableError() {}

  class P2PGame {
    constructor() {
      this.peer = null;
      this.conn = null;
      this.isHost = false;
      this.myColor = null;
      this.roomId = null;
      this.myName = '玩家';
      this.oppNameText = '等待对手…';

      this.BOARD_SIZE = 15;
      this.board = Array.from({ length: this.BOARD_SIZE }, () => Array(this.BOARD_SIZE).fill(0));
      this.moves = [];
      this.currentPlayer = 1;
      this.status = 'waiting';      // waiting | playing | ended
      this.winner = null;
      this.winLine = null;
      this.endReason = null;
      this.lastMove = null;
      this.settings = { timerMode: 'none', totalMinutes: 10, perMoveSeconds: 30 };
      this.myTotal = 0;
      this.oppTotal = 0;
      this.turnLeft = 0;            // 当前回合剩余（per-move 或展示用）
      this.oppTurnLeft = 0;

      this.timerMode = 'none';
      this.undoPending = false;
      this.rematchPending = false;

      this.pending = null;          // 待确认的落子（虚影）: { row, col }
      this.ghostRAF = 0;
      this.ghostStart = 0;

      this.cellSize = 40;
      this.padding = 20;
      this.dpr = 1;

      this.tickTimer = null;

      this.elements();
      this.bindEvents();
      this.resizeBoard();
      window.addEventListener('resize', () => this.resizeBoard());
    }

    elements() {
      this.lobbyPage = document.getElementById('lobby');
      this.gameRoomPage = document.getElementById('gameRoom');

      this.playerNameInput = document.getElementById('playerName');
      this.createRoomBtn = document.getElementById('createRoomBtn');
      this.joinRoomBtn = document.getElementById('joinRoomBtn');
      this.roomIdInput = document.getElementById('roomId');
      this.timerSeg = document.getElementById('timerSeg');
      this.totalWrap = document.getElementById('totalWrap');
      this.perMoveWrap = document.getElementById('perMoveWrap');
      this.totalMinutesInput = document.getElementById('totalMinutes');
      this.perMoveSecondsInput = document.getElementById('perMoveSeconds');
      this.statusIndicator = document.getElementById('statusIndicator');
      this.statusText = document.getElementById('statusText');

      this.backToLobbyBtn = document.getElementById('backToLobbyBtn');
      this.roomIdDisplay = document.getElementById('roomIdDisplay');
      this.gameStatusIndicator = document.getElementById('gameStatusIndicator');
      this.gameStatusText = document.getElementById('gameStatusText');

      this.oppName = document.getElementById('oppName');
      this.oppRole = document.getElementById('oppRole');
      this.oppClock = document.getElementById('oppClock');
      this.oppAvatar = document.getElementById('oppAvatar');
      this.oppBar = document.getElementById('oppBar');

      this.myNameEl = document.getElementById('myName');
      this.myRole = document.getElementById('myRole');
      this.myClock = document.getElementById('myClock');
      this.myAvatar = document.getElementById('myAvatar');
      this.myBar = document.getElementById('myBar');

      this.statusTextLine = document.getElementById('statusTextLine');
      this.boardContainer = document.getElementById('boardContainer');
      this.canvas = document.getElementById('gameBoard');

      this.undoBtn = document.getElementById('undoBtn');
      this.resignBtn = document.getElementById('resignBtn');
      this.rematchBtn = document.getElementById('rematchBtn');

      this.moveList = document.getElementById('moveList');

      this.modalOverlay = document.getElementById('modalOverlay');
      this.modalTitle = document.getElementById('modalTitle');
      this.modalText = document.getElementById('modalText');
      this.modalButtons = document.getElementById('modalButtons');
      this.toastEl = document.getElementById('toast');

      this.toastTimer = null;
      this.modalBusy = false;
    }

    bindEvents() {
      this.createRoomBtn.addEventListener('click', () => this.createRoom());
      this.joinRoomBtn.addEventListener('click', () => this.joinRoom());
      this.backToLobbyBtn.addEventListener('click', () => this.backToLobby());
      this.undoBtn.addEventListener('click', () => this.requestUndo());
      this.resignBtn.addEventListener('click', () => this.requestResign());
      this.rematchBtn.addEventListener('click', () => this.requestRematch());

      this.canvas.addEventListener('click', (e) => this.handleBoardClick(e));
      this.canvas.addEventListener('mousemove', (e) => this.handleBoardHover(e));
      this.canvas.addEventListener('mouseleave', () => { if (!this.pending) this.drawBoard(); });

      this.playerNameInput.addEventListener('input', (e) => {
        this.myName = e.target.value.trim() || '玩家';
      });

      this.roomIdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') this.joinRoom();
        const code = e.keyCode || e.which;
        if (code < 48 || code > 57) e.preventDefault();
      });
      this.roomIdInput.addEventListener('input', () => {
        this.roomIdInput.value = this.roomIdInput.value.replace(/\D/g, '').slice(0, 6);
      });

      this.timerSeg.addEventListener('click', (e) => {
        const btn = e.target.closest('.seg-btn');
        if (!btn) return;
        this.timerSeg.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.timerMode = btn.dataset.mode;
        this.totalWrap.classList.toggle('hidden', this.timerMode !== 'total');
        this.perMoveWrap.classList.toggle('hidden', this.timerMode !== 'perMove');
      });
    }

    resizeBoard() {
      const avail = Math.min(window.innerWidth - 28, 560);
      const dpr = window.devicePixelRatio || 1;
      this.dpr = dpr;
      this.canvas.style.width = avail + 'px';
      this.canvas.style.height = avail + 'px';
      this.canvas.width = Math.round(avail * dpr);
      this.canvas.height = Math.round(avail * dpr);
      this.ctx = this.canvas.getContext('2d');
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.padding = avail * 0.05;
      this.cellSize = (avail - 2 * this.padding) / (this.BOARD_SIZE - 1);
      this.drawBoard();
    }

    // ================= 大厅 / 连接 =================

    buildSettings() {
      const settings = { timerMode: this.timerMode };
      if (this.timerMode === 'total') {
        settings.totalMinutes = parseInt(this.totalMinutesInput.value, 10) || 10;
      } else if (this.timerMode === 'perMove') {
        settings.perMoveSeconds = parseInt(this.perMoveSecondsInput.value, 10) || 30;
      }
      return settings;
    }

    ensureSupported() {
      if (window.RTCPeerConnection || window.webkitRTCPeerConnection) return true;
      this.showAlert('提示', '当前浏览器不支持 WebRTC。请使用较新的系统浏览器（Chrome/夸克/Safari），或在微信右上角「在浏览器中打开」后再试。');
      return false;
    }

    createRoom() {
      if (!this.ensureSupported()) return;
      this.myName = this.playerNameInput.value.trim() || '玩家';
      this.settings = this.buildSettings();
      const code = generateCode();
      this.roomId = code;
      this.isHost = true;
      this.showGameRoom();
      this.connectPeer(PEER_PREFIX + code, () => {
        this.updateConnStatus(true);
        this.showToast('房间已创建，把房间码发给朋友');
      });
    }

    joinRoom() {
      if (!this.ensureSupported()) return;
      const roomId = this.roomIdInput.value.trim();
      if (roomId.length !== 6) {
        this.showToast('请输入6位房间码');
        return;
      }
      this.myName = this.playerNameInput.value.trim() || '玩家';
      this.roomId = roomId;
      this.isHost = false;
      this.showGameRoom();
      const self = this;
      const peer = new Peer(undefined, ICE_SERVERS);
      this.peer = peer;
      peer.on('open', (id) => {
        self.updateConnStatus(true);
        const conn = peer.connect(PEER_PREFIX + roomId, { reliable: true });
        self.bindConn(conn);
      });
      peer.on('error', (err) => {
        self.updateConnStatus(false);
        if (err && err.type === 'peer-unavailable') {
          self.showToast('房间不存在或已关闭');
        } else {
          self.showToast('连接失败：' + self.mapPeerError(err));
        }
        self.destroyPeer();
      });
    }

    connectPeer(id, onOpen) {
      const peer = new Peer(id, ICE_SERVERS);
      this.peer = peer;
      const self = this;
      peer.on('open', () => { onOpen(); });
      peer.on('connection', (conn) => {
        if (self.conn) {
          conn.send(JSON.stringify({ t: 'full' }));
          setTimeout(() => { try { conn.close(); } catch (e) {} }, 100);
          return;
        }
        self.bindConn(conn);
      });
      peer.on('error', (err) => {
        self.updateConnStatus(false);
        if (err && err.type === 'unavailable-id') {
          self.showToast('房间码冲突，请重新创建');
        } else if (err && err.type === 'peer-unavailable') {
          // host id 本身始终存在，忽略
        } else {
          self.showToast('连接错误：' + self.mapPeerError(err));
        }
      });
    }

    bindConn(conn) {
      this.conn = conn;
      const self = this;
      conn.on('open', () => {
        self.updateConnStatus(true);
        if (self.isHost) {
          // 等对方发送 join
        } else {
          conn.send(JSON.stringify({ t: 'join', name: self.myName }));
        }
      });
      conn.on('data', (data) => self.onData(data));
      conn.on('close', () => self.handlePeerDisconnected());
      conn.on('error', () => self.handlePeerDisconnected());
    }

    mapPeerError(err) {
      if (!err || !err.type) return '未知错误';
      const map = {
        'peer-unavailable': '房间不存在或已关闭',
        'network': '网络错误',
        'server-error': '服务器错误',
        'socket-error': '网络连接异常',
        'unavailable-id': '房间码冲突'
      };
      return map[err.type] || err.type;
    }

    destroyPeer() {
      try { if (this.conn) this.conn.close(); } catch (e) {}
      try { if (this.peer) this.peer.destroy(); } catch (e) {}
      this.peer = null;
      this.conn = null;
    }

    send(obj) {
      if (this.conn && this.conn.open) {
        this.conn.send(JSON.stringify(obj));
        return true;
      }
      return false;
    }

    // ================= 协议处理 =================

    onData(data) {
      let d = data;
      if (typeof data === 'string') {
        try { d = JSON.parse(data); } catch (e) { return; }
      }
      if (!d || typeof d.t !== 'string') return;

      switch (d.t) {
        case 'join':
          if (!this.isHost) return;
          this.oppNameText = d.name || '对手';
          this.send({ t: 'start', settings: this.settings, hostName: this.myName });
          this.beginGame(true);
          this.showToast('对手已加入，黑棋先手');
          break;

        case 'start':
          if (this.isHost) return;
          this.settings = d.settings || { timerMode: 'none', totalMinutes: 10, perMoveSeconds: 30 };
          this.oppNameText = d.hostName || '对手';
          this.beginGame(false);
          this.showToast('对局开始，黑棋先手');
          break;

        case 'full':
          this.showAlert('提示', '房间已满');
          this.destroyPeer();
          break;

        case 'move':
          this.applyMove(d.row, d.col);
          break;

        case 'undo-req':
          this.undoPending = true;
          this.updateButtons();
          this.confirm((d.name || '对方') + ' 请求悔棋', '是否同意撤掉上一步棋？')
            .then((ok) => {
              this.undoPending = false;
              this.updateButtons();
              if (ok) {
                this.send({ t: 'undo-res', ok: true });
                this.applyUndo();
              } else {
                this.send({ t: 'undo-res', ok: false });
              }
            });
          break;

        case 'undo-res':
          this.undoPending = false;
          this.updateButtons();
          if (d.ok) {
            this.applyUndo();
            this.showToast('悔棋成功');
          } else {
            this.showToast('对方拒绝了悔棋');
          }
          break;

        case 'resign':
          this.endLocal(this.myColor, 'resign');
          break;

        case 'timeout':
          this.endLocal(this.myColor, 'timeout');
          break;

        case 'rematch-req':
          this.rematchPending = true;
          this.updateButtons();
          this.confirm((d.name || '对方') + ' 想再来一局', '是否同意？')
            .then((ok) => {
              this.rematchPending = false;
              this.updateButtons();
              if (ok) {
                this.send({ t: 'rematch-res', ok: true });
                this.prepareRematch();
              } else {
                this.send({ t: 'rematch-res', ok: false });
              }
            });
          break;

        case 'rematch-res':
          this.rematchPending = false;
          this.updateButtons();
          if (d.ok) {
            this.prepareRematch();
          } else {
            this.showToast('对方拒绝了再来一局');
          }
          break;

        case 'clock':
          if (typeof d.turn === 'number') this.oppTurnLeft = d.turn;
          if (typeof d.total === 'number') this.oppTotal = d.total;
          this.updateClock();
          break;

        case 'bye':
          this.handlePeerDisconnected();
          break;

        case 'msg':
          this.showToast(d.text || '');
          break;
      }
    }

    handlePeerDisconnected() {
      if (this.status === 'playing') {
        this.endLocal(this.myColor, 'disconnect');
      }
      this.updateConnStatus(false);
      if (this.status !== 'ended') {
        this.showToast('与对手的连接已断开');
      }
    }

    // ================= 对局逻辑 =================

    beginGame(isHostBeginning) {
      this.myColor = this.isHost ? 1 : 2;
      this.resetBoardState();
      this.status = 'playing';
      this.currentPlayer = 1;
      this.initClock();
      this.startTicking();
      this.render();
    }

    prepareRematch() {
      // 交换双方颜色
      this.myColor = this.myColor === 1 ? 2 : 1;
      this.resetBoardState();
      this.status = 'playing';
      this.currentPlayer = 1;
      this.initClock();
      this.startTicking();
      this.render();
      this.showToast('再来一局，交换先后手');
    }

    resetBoardState() {
      this.board = Array.from({ length: this.BOARD_SIZE }, () => Array(this.BOARD_SIZE).fill(0));
      this.moves = [];
      this.winner = null;
      this.winLine = null;
      this.endReason = null;
      this.lastMove = null;
      this.undoPending = false;
      this.rematchPending = false;
      this.turnLeft = 0;
      this.oppTurnLeft = 0;
    }

    initClock() {
      if (this.settings.timerMode === 'total') {
        const t = this.settings.totalMinutes * 60;
        this.myTotal = t;
        this.oppTotal = t;
      } else {
        this.myTotal = 0;
        this.oppTotal = 0;
      }
      if (this.settings.timerMode === 'perMove') {
        this.turnLeft = this.currentPlayer === this.myColor ? this.settings.perMoveSeconds : 0;
        this.oppTurnLeft = this.currentPlayer === this.myColor ? 0 : this.settings.perMoveSeconds;
      }
    }

    startTicking() {
      this.stopTicking();
      const self = this;
      this.tickTimer = setInterval(() => self.tick(), 1000);
    }

    stopTicking() {
      if (this.tickTimer) {
        clearInterval(this.tickTimer);
        this.tickTimer = null;
      }
    }

    tick() {
      if (this.status !== 'playing') { this.stopTicking(); return; }
      const s = this.settings;
      if (s.timerMode === 'none') return;
      if (!this.isMyTurn()) return;

      if (s.timerMode === 'total') {
        this.myTotal = Math.max(0, this.myTotal - 1);
        this.send({ t: 'clock', total: this.myTotal });
        if (this.myTotal <= 0) { this.timeoutSelf(); return; }
      } else if (s.timerMode === 'perMove') {
        this.turnLeft = Math.max(0, this.turnLeft - 1);
        this.send({ t: 'clock', turn: this.turnLeft });
        if (this.turnLeft <= 0) { this.timeoutSelf(); return; }
      }
      this.updateClock();
    }

    timeoutSelf() {
      this.send({ t: 'timeout' });
      this.endLocal(3 - this.myColor, 'timeout');
    }

    endLocal(winnerColor, reason) {
      if (this.status === 'ended') return;
      this.clearPending();
      this.status = 'ended';
      this.winner = winnerColor;
      this.endReason = reason;
      this.stopTicking();
      this.render();
      const iWon = this.winner === this.myColor;
      const title = this.winner === 0 ? '平局' : (iWon ? '恭喜获胜！' : '本局失败');
      const text = this.winner === 0 ? '棋盘已满，平局' : this.endReasonText(iWon);
      this.alertMsg(title, text);
    }

    isMyTurn() {
      return this.status === 'playing' && this.currentPlayer === this.myColor;
    }

    applyMove(row, col) {
      if (this.status !== 'playing') return;
      this.clearPending();
      row = parseInt(row, 10); col = parseInt(col, 10);
      if (isNaN(row) || isNaN(col)) return;
      if (row < 0 || row >= this.BOARD_SIZE || col < 0 || col >= this.BOARD_SIZE) return;
      if (this.board[row][col] !== 0) return;

      const color = this.currentPlayer;
      this.board[row][col] = color;
      this.moves.push({ row, col, color });
      this.lastMove = { row, col, color };

      const winLine = this.checkWin(row, col, color);
      if (winLine) {
        this.winLine = winLine;
        this.endLocal(color, 'win');
        this.render();
        return;
      }
      if (this.moves.length === this.BOARD_SIZE * this.BOARD_SIZE) {
        this.endLocal(0, 'draw');
        this.render();
        return;
      }

      this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
      if (this.settings.timerMode === 'perMove') {
        if (this.currentPlayer === this.myColor) {
          this.turnLeft = this.settings.perMoveSeconds;
        } else {
          this.oppTurnLeft = this.settings.perMoveSeconds;
        }
      }
      this.render();
    }

    applyUndo() {
      if (this.moves.length === 0) return;
      this.clearPending();
      const currentPlayerBefore = this.currentPlayer;
      const last = this.moves[this.moves.length - 1];
      this.board[last.row][last.col] = 0;
      this.moves.pop();
      this.currentPlayer = currentPlayerBefore;
      this.lastMove = this.moves.length ? this.moves[this.moves.length - 1] : null;
      if (this.settings.timerMode === 'perMove') {
        if (this.currentPlayer === this.myColor) {
          this.turnLeft = this.settings.perMoveSeconds;
        } else {
          this.oppTurnLeft = this.settings.perMoveSeconds;
        }
      }
      this.render();
    }

    checkWin(row, col, color) {
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (const [dr, dc] of dirs) {
        const line = [[row, col]];
        for (let i = 1; i < this.BOARD_SIZE; i++) {
          const r = row + dr * i, c = col + dc * i;
          if (r < 0 || r >= this.BOARD_SIZE || c < 0 || c >= this.BOARD_SIZE || this.board[r][c] !== color) break;
          line.push([r, c]);
        }
        for (let i = 1; i < this.BOARD_SIZE; i++) {
          const r = row - dr * i, c = col - dc * i;
          if (r < 0 || r >= this.BOARD_SIZE || c < 0 || c >= this.BOARD_SIZE || this.board[r][c] !== color) break;
          line.push([r, c]);
        }
        if (line.length >= 5) return line;
      }
      return null;
    }

    // ================= 操作 =================

    handleBoardClick(e) {
      if (!this.isMyTurn() || this.undoPending || this.rematchPending || this.modalBusy) return;
      const cell = this.getCell(e);
      if (!cell) return;
      if (this.board[cell.row][cell.col] !== 0) return;
      if (this.pending && this.pending.row === cell.row && this.pending.col === cell.col) {
        this.clearPending();
        this.send({ t: 'move', row: cell.row, col: cell.col });
        this.applyMove(cell.row, cell.col);
      } else {
        this.setPending(cell.row, cell.col);
      }
    }

    setPending(row, col) {
      this.pending = { row, col };
      this.ghostStart = performance.now();
      if (this.ghostRAF) cancelAnimationFrame(this.ghostRAF);
      const loop = () => {
        if (!this.pending || this.undoPending || this.rematchPending || this.modalBusy || !this.isMyTurn()) {
          this.ghostRAF = 0;
          this.drawBoard();
          return;
        }
        const t = (performance.now() - this.ghostStart) / 1000;
        const ph = t * Math.PI * 2;
        const S = Math.sin(ph);
        this.drawBoard();
        this.drawGhost(this.pending.row, this.pending.col, this.myColor, S);
        this.ghostRAF = requestAnimationFrame(loop);
      };
      this.ghostRAF = requestAnimationFrame(loop);
    }

    clearPending() {
      this.pending = null;
      if (this.ghostRAF) cancelAnimationFrame(this.ghostRAF);
      this.ghostRAF = 0;
    }

    drawGhost(row, col, color, S) {
      const x = this.padding + col * this.cellSize;
      const y = this.padding + row * this.cellSize;
      const radius = this.cellSize * 0.43;

      this.ctx.save();
      this.ctx.globalAlpha = 0.42 + 0.22 * S;
      const scale = 1 + 0.07 * S;
      const g = this.ctx.createRadialGradient(x, y - radius * 0.3, radius * 0.1, x, y, radius * scale);
      if (color === 1) {
        g.addColorStop(0, 'rgba(90,90,90,0.9)');
        g.addColorStop(1, 'rgba(17,17,17,0.9)');
      } else {
        g.addColorStop(0, 'rgba(255,255,255,0.9)');
        g.addColorStop(1, 'rgba(207,207,207,0.9)');
      }
      this.ctx.fillStyle = g;
      this.ctx.beginPath();
      this.ctx.arc(x, y, radius * scale, 0, Math.PI * 2);
      this.ctx.fill();

      const ring = ((S + 1) / 2); // 0..1
      const ringR = this.cellSize * (0.30 + 0.34 * ring);
      const ringA = 0.6 * (1 - ring) + 0.15;
      this.ctx.globalAlpha = ringA;
      this.ctx.strokeStyle = color === 1 ? '#3a3a3a' : '#888888';
      this.ctx.lineWidth = 1.6;
      this.ctx.beginPath();
      this.ctx.arc(x, y, ringR, 0, Math.PI * 2);
      this.ctx.stroke();

      this.ctx.globalAlpha = 0.85;
      this.ctx.fillStyle = '#e74c3c';
      this.ctx.beginPath();
      this.ctx.arc(x, y, this.cellSize * 0.07, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.restore();
    }

    handleBoardHover(e) {
      if (this.pending) return;
      if (!this.isMyTurn() || this.undoPending || this.rematchPending) return;
      if (e.pointerType === 'touch') return;
      const cell = this.getCell(e);
      this.drawBoard();
      if (cell && this.board[cell.row][cell.col] === 0) {
        this.drawPreview(cell.row, cell.col, this.myColor);
        this.canvas.style.cursor = 'pointer';
      } else {
        this.canvas.style.cursor = 'default';
      }
    }

    getCell(e) {
      const rect = this.canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const col = Math.round((x - this.padding) / this.cellSize);
      const row = Math.round((y - this.padding) / this.cellSize);
      if (row < 0 || row >= this.BOARD_SIZE || col < 0 || col >= this.BOARD_SIZE) return null;
      return { row, col };
    }

    requestUndo() {
      if (this.undoBtn.disabled) return;
      this.undoPending = true;
      this.updateButtons();
      this.send({ t: 'undo-req', name: this.myName });
      this.showToast('已发送悔棋请求，等待对方…');
    }

    requestResign() {
      if (this.resignBtn.disabled) return;
      this.confirm('认输', '确定要认输吗？')
        .then((ok) => {
          if (ok) {
            this.send({ t: 'resign' });
            this.endLocal(3 - this.myColor, 'resign');
          }
        });
    }

    requestRematch() {
      if (this.rematchBtn.disabled) return;
      this.rematchPending = true;
      this.updateButtons();
      this.send({ t: 'rematch-req', name: this.myName });
    }

    backToLobby() {
      this.send({ t: 'bye' });
      this.destroyPeer();
      this.resetAll();
      this.gameRoomPage.classList.remove('active');
      this.lobbyPage.classList.add('active');
      this.updateConnStatus(false);
    }

    resetAll() {
      this.isHost = false;
      this.myColor = null;
      this.roomId = null;
      this.stopTicking();
      this.resetBoardState();
      this.status = 'waiting';
      this.oppNameText = '等待对手…';
      this.oppName.textContent = this.oppNameText;
      this.render();
    }

    showGameRoom() {
      this.lobbyPage.classList.remove('active');
      this.gameRoomPage.classList.add('active');
      this.roomIdDisplay.textContent = this.roomId;
      this.render();
    }

    // ================= 渲染 =================

    render() {
      this.drawBoard();
      this.updateRoles();
      this.updateClock();
      this.updateStatus();
      this.updateButtons();
      this.updateMoveList();
    }

    updateRoles() {
      const myBlack = this.myColor === 1;
      this.oppRole.textContent = (myBlack ? '白棋 · 后手' : '黑棋 · 先手');
      this.myRole.textContent = myBlack ? '黑棋 · 先手' : '白棋 · 后手';
      this.oppAvatar.className = 'piece-avatar ' + (myBlack ? 'white' : 'black');
      this.myAvatar.className = 'piece-avatar ' + (myBlack ? 'black' : 'white');
      this.myNameEl.textContent = this.myName + '（你）';
      this.oppName.textContent = this.oppNameText;
    }

    updateStatus() {
      const el = this.statusTextLine;
      const timerText = this.settings.timerMode === 'perMove' && this.status === 'playing'
        ? ' · 本步剩余 ' + (this.isMyTurn() ? Math.ceil(this.turnLeft) : Math.ceil(this.oppTurnLeft)) + 's'
        : '';

      if (this.status === 'waiting') {
        el.textContent = '等待对手加入… 房间码：' + this.roomId;
      } else if (this.status === 'playing') {
        this.oppBar.classList.toggle('turning', this.currentPlayer !== this.myColor);
        this.myBar.classList.toggle('turning', this.isMyTurn());
        el.textContent = (this.isMyTurn() ? '轮到你了' : '等待对手落子…') + timerText;
      } else {
        this.oppBar.classList.remove('turning');
        this.myBar.classList.remove('turning');
        if (this.winner === 0) {
          el.textContent = '平局';
        } else if (this.winner === this.myColor) {
          el.textContent = this.endReasonText(true);
        } else {
          el.textContent = this.endReasonText(false);
        }
      }
    }

    endReasonText(iWon) {
      switch (this.endReason) {
        case 'resign': return iWon ? '对方认输，你赢了！' : '你认输了';
        case 'timeout': return iWon ? '对方超时，你赢了！' : '你超时了';
        case 'disconnect': return iWon ? '对方已断开，你赢了！' : '你已断开连接';
        default: return iWon ? '五子连珠，你赢了！' : '五子连珠，你输了';
      }
    }

    updateButtons() {
      const playing = this.status === 'playing';
      const ended = this.status === 'ended';
      this.undoBtn.disabled = !(playing && this.isMyTurn() && this.moves.length > 0 && !this.undoPending && !this.rematchPending);
      this.resignBtn.disabled = !(playing && !this.undoPending);
      this.rematchBtn.disabled = !(ended && !this.rematchPending);
    }

    updateClock() {
      const mode = this.settings.timerMode;
      if (mode === 'none') {
        this.myClock.textContent = '--:--';
        this.oppClock.textContent = '--:--';
        return;
      }
      if (mode === 'perMove') {
        const mine = this.isMyTurn();
        this.myClock.textContent = mine ? Math.max(0, Math.ceil(this.turnLeft)) + 's' : '--:--';
        this.oppClock.textContent = mine ? '--:--' : Math.max(0, Math.ceil(this.oppTurnLeft)) + 's';
        this.myClock.classList.toggle('low', mine && this.turnLeft <= 5);
        this.oppClock.classList.toggle('low', !mine && this.oppTurnLeft <= 5);
        return;
      }
      // total
      this.oppClock.textContent = this.fmt(this.oppTotal);
      this.myClock.textContent = this.fmt(this.myTotal);
      this.oppClock.classList.toggle('low', this.oppTotal > 0 && this.oppTotal <= 10);
      this.myClock.classList.toggle('low', this.myTotal > 0 && this.myTotal <= 10);
    }

    fmt(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return (m < 10 ? '0' + m : m) + ':' + (r < 10 ? '0' + r : r);
    }

    updateMoveList() {
      this.moveList.innerHTML = '';
      this.moves.forEach((mv, i) => {
        const item = document.createElement('div');
        item.className = 'move-item';
        item.textContent = (i + 1) + '. ' + (mv.color === 1 ? '黑' : '白') + ' (' + (mv.row + 1) + ',' + (mv.col + 1) + ')';
        if (i === this.moves.length - 1 && this.status === 'playing') item.classList.add('last');
        this.moveList.appendChild(item);
      });
      this.moveList.scrollTop = this.moveList.scrollHeight;
    }

    updateConnStatus(online) {
      const inLobby = this.lobbyPage.classList.contains('active');
      const ind = inLobby ? this.statusIndicator : this.gameStatusIndicator;
      const txt = inLobby ? this.statusText : this.gameStatusText;
      ind.classList.toggle('online', online);
      ind.classList.toggle('offline', !online);
      txt.textContent = online ? '在线' : '离线';
    }

    // ================= 绘制 =================

    drawBoard() {
      if (!this.ctx) return;
      const size = this.padding * 2 + this.cellSize * (this.BOARD_SIZE - 1);
      this.ctx.fillStyle = '#f0d9a7';
      this.ctx.fillRect(0, 0, size, size);

      this.ctx.strokeStyle = '#5a3e22';
      this.ctx.lineWidth = 1;
      for (let i = 0; i < this.BOARD_SIZE; i++) {
        this.ctx.beginPath();
        this.ctx.moveTo(this.padding, this.padding + i * this.cellSize);
        this.ctx.lineTo(this.padding + (this.BOARD_SIZE - 1) * this.cellSize, this.padding + i * this.cellSize);
        this.ctx.stroke();
        this.ctx.beginPath();
        this.ctx.moveTo(this.padding + i * this.cellSize, this.padding);
        this.ctx.lineTo(this.padding + i * this.cellSize, this.padding + (this.BOARD_SIZE - 1) * this.cellSize);
        this.ctx.stroke();
      }

      const stars = [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]];
      this.ctx.fillStyle = '#5a3e22';
      stars.forEach(([r, c]) => {
        this.ctx.beginPath();
        this.ctx.arc(this.padding + c * this.cellSize, this.padding + r * this.cellSize, 3.2, 0, Math.PI * 2);
        this.ctx.fill();
      });

      for (let r = 0; r < this.BOARD_SIZE; r++) {
        for (let c = 0; c < this.BOARD_SIZE; c++) {
          if (this.board[r][c] !== 0) this.drawPiece(r, c, this.board[r][c]);
        }
      }

      if (this.lastMove) {
        const x = this.padding + this.lastMove.col * this.cellSize;
        const y = this.padding + this.lastMove.row * this.cellSize;
        this.ctx.fillStyle = '#e74c3c';
        this.ctx.beginPath();
        this.ctx.arc(x, y, this.cellSize * 0.12, 0, Math.PI * 2);
        this.ctx.fill();
      }

      if (this.winLine && this.winLine.length >= 2) {
        this.ctx.strokeStyle = 'rgba(231, 76, 60, 0.75)';
        this.ctx.lineWidth = 4;
        this.ctx.beginPath();
        const s = this.winLine[0], e = this.winLine[this.winLine.length - 1];
        this.ctx.moveTo(this.padding + s[1] * this.cellSize, this.padding + s[0] * this.cellSize);
        this.ctx.lineTo(this.padding + e[1] * this.cellSize, this.padding + e[0] * this.cellSize);
        this.ctx.stroke();

        this.winLine.forEach(([r, c]) => {
          const x = this.padding + c * this.cellSize;
          const y = this.padding + r * this.cellSize;
          this.ctx.strokeStyle = 'rgba(231, 76, 60, 0.9)';
          this.ctx.lineWidth = 2;
          this.ctx.beginPath();
          this.ctx.arc(x, y, this.cellSize * 0.45, 0, Math.PI * 2);
          this.ctx.stroke();
        });
      }
    }

    drawPiece(row, col, color) {
      const x = this.padding + col * this.cellSize;
      const y = this.padding + row * this.cellSize;
      const radius = this.cellSize * 0.43;

      this.ctx.save();
      this.ctx.shadowColor = 'rgba(0,0,0,0.35)';
      this.ctx.shadowBlur = 4;
      this.ctx.shadowOffsetX = 1.5;
      this.ctx.shadowOffsetY = 1.5;

      const g = this.ctx.createRadialGradient(x - radius / 3, y - radius / 3, radius / 6, x, y, radius);
      if (color === 1) {
        g.addColorStop(0, '#5a5a5a');
        g.addColorStop(1, '#111111');
      } else {
        g.addColorStop(0, '#ffffff');
        g.addColorStop(1, '#cfcfcf');
      }
      this.ctx.fillStyle = g;
      this.ctx.beginPath();
      this.ctx.arc(x, y, radius, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.restore();

      this.ctx.strokeStyle = color === 1 ? '#000' : '#999';
      this.ctx.lineWidth = 1;
      this.ctx.beginPath();
      this.ctx.arc(x, y, radius, 0, Math.PI * 2);
      this.ctx.stroke();
    }

    drawPreview(row, col, color) {
      const x = this.padding + col * this.cellSize;
      const y = this.padding + row * this.cellSize;
      this.ctx.save();
      this.ctx.globalAlpha = 0.45;
      this.ctx.beginPath();
      this.ctx.arc(x, y, this.cellSize * 0.43, 0, Math.PI * 2);
      this.ctx.fillStyle = color === 1 ? '#222' : '#eee';
      this.ctx.fill();
      this.ctx.restore();
    }

    // ================= UI 组件 =================

    showToast(text, ms) {
      this.toastEl.textContent = text;
      this.toastEl.classList.remove('hidden');
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => this.toastEl.classList.add('hidden'), ms || 2600);
    }

    showModal(title, text, buttons) {
      if (this.modalBusy) {
        this.showToast('请先处理当前提示');
        return Promise.resolve(null);
      }
      return new Promise((resolve) => {
        this.modalBusy = true;
        this.modalTitle.textContent = title;
        this.modalText.textContent = text;
        this.modalButtons.innerHTML = '';
        buttons.forEach(b => {
          const btn = document.createElement('button');
          btn.className = 'btn ' + (b.className || 'btn-primary');
          btn.textContent = b.label;
          btn.addEventListener('click', () => {
            this.modalBusy = false;
            this.modalOverlay.classList.add('hidden');
            resolve(b.value);
          });
          this.modalButtons.appendChild(btn);
        });
        this.modalOverlay.classList.remove('hidden');
      });
    }

    confirm(title, text) {
      return this.showModal(title, text, [
        { label: '取消', value: false, className: 'btn-ghost' },
        { label: '确定', value: true, className: 'btn-primary' }
      ]);
    }

    alertMsg(title, text) {
      return this.showModal(title, text, [
        { label: '确定', value: true, className: 'btn-primary' }
      ]);
    }

    showAlert(title, text) {
      return this.alertMsg(title, text);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    window.game = new P2PGame();
  });
})();

  </script>
</body>
